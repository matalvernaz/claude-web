name: Release binaries

# Build standalone bundles on tag push (matching `v*`) and attach them
# to the GitHub Release for that tag. The existing docker-publish.yml
# already covers the container image on the same trigger; this workflow
# is additive — Windows, macOS, and Linux native bundles for people who
# don't want to run a container.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach binaries to (e.g. v0.4.2). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            archive_ext: zip
          - os: macos-latest
            target: macos-arm64
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: linux-x64
            archive_ext: tar.gz
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        # 3.13 is the highest version covered by the CI matrix; pin one
        # to keep the frozen bundle's interpreter version deterministic
        # across releases.
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Install Linux desktop backend
        # pywebview on Linux needs a GTK or Qt webview backend. Without
        # one, ``import webview`` works but ``webview.start()`` fails.
        # The headless-only GitHub runner doesn't ship them, so install
        # the GTK4 + WebKit2GTK stack — smaller transitive footprint
        # than QtWebEngine and matches what most Linux desktops use.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libgirepository-1.0-1 libwebkit2gtk-4.1-0 \
            gir1.2-webkit2-4.1 python3-gi

      - name: Install runtime + PyInstaller
        # bash is uniform across all three runners; PowerShell would
        # otherwise parse `>=6.10` as a redirection.
        #
        # --only-binary for the SDK: its wheels carry the bundled Claude CLI
        # the app falls back to when claude isn't on PATH, and its sdist
        # doesn't. 0.2.160 published no Windows wheel (it outgrew PyPI's
        # per-file limit), so pip built the sdist and the Windows bundle
        # shipped without a CLI. Wheel-only picks the newest release that
        # has one for each platform.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary claude-agent-sdk -r requirements.txt
          pip install -r requirements-desktop.txt
          pip install "pyinstaller>=6.10"

      - name: Resolve tag name
        id: tag
        shell: bash
        # github.ref_name is the tag on a tag push but unset for
        # workflow_dispatch; fall back to the manual input. Bash works
        # uniformly on all three runners (windows-latest ships Git Bash).
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp build identity
        # self_update compares this against the repo's GitHub releases; a
        # source checkout stays "dev" and never offers an update.
        shell: bash
        run: |
          python - "${{ steps.tag.outputs.name }}" "${{ matrix.target }}" "${{ github.sha }}" <<'PY'
          import datetime, pathlib, sys
          tag, target, commit = sys.argv[1:4]
          built = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          pathlib.Path("build_info.py").write_text(
              f"VERSION = {tag!r}\nBUILT_AT = {built!r}\nCOMMIT = {commit!r}\nTARGET = {target!r}\n",
              encoding="utf-8",
          )
          print(pathlib.Path("build_info.py").read_text(encoding="utf-8"))
          PY

      - uses: microsoft/setup-msbuild@v3
        if: matrix.os == 'windows-latest'
      - name: Build ZipExtractor.exe (self-update helper)
        if: matrix.os == 'windows-latest'
        # ravibpatel/AutoUpdater.NET's ZipExtractor (MIT), the helper Libation
        # and the operator's other portable apps use: it waits for every
        # claude-web process to exit, overlays the update zip on the install
        # (portable-data is not in the zip, so it is untouched), and relaunches
        # the exe. The upstream csproj targets net45, whose targeting pack is
        # not on the runner; retarget to net48 (present on Win10 1803+). VS
        # MSBuild, not `dotnet build`: the .NET SDK's resource pipeline errors
        # on net48 WinForms .resx with non-string resources.
        shell: pwsh
        run: |
          $tag = 'v1.9.2'
          git clone --depth 1 --branch $tag https://github.com/ravibpatel/AutoUpdater.NET.git zipextractor_src
          $csproj = 'zipextractor_src/ZipExtractor/ZipExtractor.csproj'
          $text = Get-Content $csproj -Raw
          $text = $text.Replace('<TargetFramework>net45</TargetFramework>', '<TargetFramework>net48</TargetFramework>')
          $text = $text.Replace("'net45'", "'net48'")
          Set-Content $csproj $text
          msbuild $csproj /restore /p:Configuration=Release /p:SignAssembly=false /v:minimal
          New-Item -ItemType Directory -Force -Path zipextractor_bin | Out-Null
          Copy-Item zipextractor_src/AutoUpdater.NET/Resources/ZipExtractor.exe zipextractor_bin/
          Get-ChildItem zipextractor_bin/

      - name: Build with PyInstaller
        # --clean wipes prior build caches so a stale hook doesn't
        # silently pin an old hidden-import list across releases.
        run: pyinstaller --clean --noconfirm claude_web.spec

      - name: Bundle ZipExtractor.exe beside the exe
        # self_update.can_self_replace() looks for it next to claude-web.exe;
        # without it the app only reports that an update exists.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item zipextractor_bin/ZipExtractor.exe dist/claude-web/

      - name: Check the bundled Claude CLI made it in
        # Without it, a user with no system claude install can't run a
        # single chat turn, and nothing else in the build would notice.
        shell: bash
        run: |
          cli=dist/claude-web/_internal/claude_agent_sdk/_bundled/claude
          [ -s "$cli.exe" ] && cli="$cli.exe"
          if [ ! -s "$cli" ]; then
            echo "::error::claude_agent_sdk's bundled CLI is missing from the bundle"
            exit 1
          fi
          ls -l "$cli"
          "$cli" --version

      - name: Drop .env.example next to the binary
        # PyInstaller's onedir mode buries `datas` under `_internal/`,
        # which is the wrong place for a file users are supposed to copy
        # and edit. Stage it at the top of the dist tree so it lands as
        # a sibling of the exe in the archive.
        shell: bash
        run: cp .env.example dist/claude-web/.env.example

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # Compress-Archive -Path dist/claude-web (no trailing /*) zips
        # the directory itself, so end users `Expand-Archive` and get a
        # `claude-web\` folder rather than loose files in their downloads.
        run: |
          $archiveName = "claude-web-${{ steps.tag.outputs.name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path dist/claude-web -DestinationPath $archiveName
          "ARCHIVE=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package archive (POSIX)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          archive="claude-web-${{ steps.tag.outputs.name }}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "$archive" claude-web
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Smoke-test the binary on a machine with no claude installed
        # Boots the built app the way a first-time user does and checks it
        # finds its bundled CLI and can start a sign-in with it. v0.4.0's
        # Windows binary carried the CLI, but sign-in looked on PATH alone
        # and failed with "claude CLI not found on PATH". Runs after
        # packaging so the logs the app writes beside itself stay out of
        # the archive.
        shell: bash
        timeout-minutes: 5
        run: |
          if command -v claude >/dev/null 2>&1; then
            echo "::error::this runner has a claude on PATH; the smoke test needs a machine without one"
            exit 1
          fi
          exe=dist/claude-web/claude-web
          [ -f "$exe.exe" ] && exe="$exe.exe"
          base=http://127.0.0.1:38471
          "$exe" --headless --port 38471 > smoke.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -sf "$base/healthz" >/dev/null && break
            sleep 1
          done
          curl -sf "$base/api/claude-cli/status" > cli-status.json || true
          curl -sf -X POST -H "Content-Type: application/json" -H "Origin: $base" \
            -d '{"variant":"claudeai"}' "$base/api/setup/oauth/start" > sign-in.json || true
          curl -s -X POST -H "Origin: $base" "$base/api/setup/oauth/cancel" >/dev/null || true
          kill "$pid" 2>/dev/null || true
          cat smoke.log
          python - <<'PY'
          import json, sys

          def load(name):
              try:
                  return json.load(open(name))
              except Exception as exc:
                  return {"error": f"{name}: {exc}"}

          status, sign_in = load("cli-status.json"), load("sign-in.json")
          print("cli:", status.get("cli_source"), status.get("cli_path"), status.get("error") or "")
          print("sign-in:", sign_in.get("status"), sign_in.get("error") or "")
          ok = status.get("cli_source") == "bundled" and sign_in.get("status") == "awaiting_code"
          sys.exit(0 if ok else 1)
          PY

      - name: Smoke-test portable accounts from another working directory
        shell: bash
        timeout-minutes: 3
        run: |
          exe=dist/claude-web/claude-web
          [ -f "$exe.exe" ] && exe="$exe.exe"
          python scripts/smoke_portable.py "$exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-web-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # workflow_dispatch jobs don't auto-create a release; only attach
    # when this is a real tag push and skip on manual runs (the
    # artifacts are still uploadable from the build job's artifact list).
    if: github.event_name == 'push'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          # Glob across the three platform artifact folders.
          files: artifacts/**/*
          fail_on_unmatched_files: true
          # Don't overwrite an existing release body — let the developer
          # write release notes; we just attach the binaries.
          generate_release_notes: true
